syntax = "proto3";

option csharp_namespace = "TransactionService.Infrastructure.Protos";

service AccountProtoService {
  rpc GetAccountStatus (GetAccountRequest) returns (AccountResponse);
}

message GetAccountRequest {
  string account_id = 1;
  string user_id = 2;
}

message AccountResponse {
  bool exists = 1;
  string message = 2;
}