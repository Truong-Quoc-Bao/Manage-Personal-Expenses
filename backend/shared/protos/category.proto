syntax = "proto3";

option csharp_namespace = "TransactionService.Infrastructure.Protos";

service CategoryProtoService {
  rpc GetCategoryStatus (GetCategoryRequest) returns (CategoryResponse);
  rpc GetCategoriesByUser (GetCategoriesByUserRequest) returns (GetCategoriesByUserResponse);
}

message GetCategoryRequest {
  string category_id = 1;
  string user_id = 2;
  string transaction_type = 3;
}

message CategoryResponse {
  bool valid = 1;
  string message = 2;
}

// --- Analytics support ---

message GetCategoriesByUserRequest {
  string user_id = 1;
}

message CategoryInfo {
  string category_id   = 1;
  string category_name = 2;
  string type          = 3;
}

message GetCategoriesByUserResponse {
  bool                   valid      = 1;
  string                 message    = 2;
  repeated CategoryInfo  categories = 3;
}