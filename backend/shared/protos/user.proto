syntax = "proto3";

option csharp_namespace = "Auth.Infrastructure.Protos";

service UserProtoService {
  rpc GetUserStatus (GetUserRequest) returns (UserResponse);
  rpc GetUserInfo (GetUserInfoRequest) returns (UserInfoResponse);
}

message GetUserRequest {
  string email = 1;
}

message UserResponse {
  bool exists = 1;
  string message = 2;
}

// --- Analytics support ---

message GetUserInfoRequest {
  string user_id = 1;
}

message UserInfoResponse {
  string user_id   = 1;
  string user_name = 2;
  bool   valid     = 3;
  string message   = 4;
}