# 1. Định nghĩa các nhóm biến môi trường
envVarGroups:
  - name: common-secrets
    envVars: # Đã sửa từ 'envs' thành 'envVars'
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: D8F9G0H1J2K3L4M5N6B7V8C9X0Z1Q2W3E4R5T6Y7U8I9O0P1A2S3D4F5G6H7J8K9L0M1N2B3V4C5X6Z7Q8W9E0R1T2Y3U4I5O6P7A8S9D0F1G2H3J4K5L6M7N8B9V0C1X2Z3Q4W5E6R7T8Y9U0I1O2P3A4S5D6F7G8H9J0K1L2M3N4B5V6C7X8Z9Q0W1E2R3T4Y5U6I7O8P9A0S1D2F3G4H5J6K7L8Z9X0C1V2B3N4M5Q6W7E8R9T0Y1U2I3
      - key: RABBITMQ_URL
        sync: false
      - key: REDIS_URL
        sync: false

# 2. Định nghĩa các Service
services:
  # --- API GATEWAY ---
  - type: web
    name: gateway
    runtime: docker # Dùng runtime thay vì env
    dockerContext: .
    dockerfilePath: backend/gateway/Dockerfile
    plan: free
    # Cấu hình port thông qua envVars để tránh lỗi schema
    envVars:
      - fromGroup: common-secrets
      - key: PORT
        value: 3000
      - key: USER_SERVICE_URL
        value: http://user-service-app:3001

  # --- USER SERVICE ---
  - type: web
    name: user-service-app
    runtime: docker
    dockerContext: .
    dockerfilePath: backend/user_service/Dockerfile
    plan: free
    envVars:
      - fromGroup: common-secrets
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        value: postgresql://postgres:datletan16072004@db.mdzmjrxpntwapuiyhqdo.supabase.co:5432/postgres?schema=user_service

  # --- AUTH SERVICE ---
  - type: web
    name: auth-service-app
    runtime: docker
    dockerContext: .
    dockerfilePath: backend/auth_service/Dockerfile
    plan: free
    envVars:
      - fromGroup: common-secrets
      - key: PORT
        value: 3006
      - key: ConnectionStrings__DefaultConnection
        value: Host=aws-1-ap-southeast-1.pooler.supabase.com;Port=5432;Database=postgres;Username=postgres.mdzmjrxpntwapuiyhqdo;Password=datletan16072004;SearchPath=auth_service;Trust Server Certificate=true
